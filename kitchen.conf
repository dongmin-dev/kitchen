# kitchen.conf — every model and permission choice lives here.
# Read by both zsh (chef) and bash (bin/kitchen): keep plain VAR=value / VAR=(...) syntax.

# Orchestrator
CHEF_MODEL=claude-fable-5-2
CHEF_EFFORT=medium

# Workers (Claude Code)
WORKER_MODEL=claude-opus-5-5
WORKER_EFFORT=medium              # default; the orchestrator may ask for "high" per worker
WORKER_PERMISSION_MODE=acceptEdits
# Shell commands a worker may run without asking you. Anything else shows up as "blocked" in Herdr.
WORKER_ALLOWED=("Bash(git *)" "Bash(gh pr *)" "Bash(npm *)" "Bash(pnpm *)" "Bash(npx *)" "Bash(node *)" "Bash(python3 *)" "Bash(pytest *)" "Bash(pio *)")

# 1 = when you have already trusted a repository in Claude Code, a new worktree of that
#     repository is recorded as trusted too, so workers do not stop at the trust dialog.
# 0 = you answer "Yes, I trust this folder" yourself for every new worker.
TRUST_WORKTREES=1

# Designers (Claude Code working in Figma through MCP tools)
DESIGNER_EFFORT=high
DESIGNER_ALLOWED=("mcp__*")       # MCP tools a designer may call without asking you

# Codex review (the same engine as /review, run without the menu)
REVIEW_ARGS=(-c 'model="gpt-6.1-sol"' -c 'model_reasoning_effort="high"')

# Codex tester (interactive agent that runs tests and drives the browser)
TESTER_ARGS=(-m gpt-6.1-sol -c model_reasoning_effort=high)
