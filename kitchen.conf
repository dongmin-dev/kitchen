# kitchen.conf — the default of every setting. Do not edit this file: an update would
# stop on it. Put the lines you want to change in one of these instead (later wins):
#   ~/.kitchen/conf                      this machine, every project
#   ~/.kitchen/projects/<project>.conf   one project (the folder chef is started in)
# "kitchen conf" shows the values in force and where each comes from.
# Every agent runs without permission prompts; bin/kitchen and chef pass the flags
# for that themselves, so nothing here or in your shell setup has to.
# Read by both zsh (chef) and bash (bin/kitchen): keep plain VAR=value syntax.

# Orchestrator
CHEF_MODEL=claude-fable-5-2
CHEF_EFFORT=medium
# The only tools the orchestrator has. No subagents, no file editing, no MCP tools:
# it acts through the kitchen command.
CHEF_TOOLS="Bash,Read,Grep,Glob,WebSearch,WebFetch"

# Workers (Claude Code)
WORKER_MODEL=claude-opus-5-5
WORKER_EFFORT=medium              # default; the orchestrator may ask for "high" per worker

# Designers (Claude Code working in Figma through MCP tools)
DESIGNER_EFFORT=high

# Codex reviews and tests every branch (kitchen check)
CODEX_MODEL=gpt-6.1-sol
REVIEW_EFFORT=high
TESTER_EFFORT=high

# iOS apps are tested in a simulator, one per worker (kitchen sim)
SIM_DEVICE="iPhone 17"            # a name from: xcrun simctl list devicetypes
SIM_MAX=2                         # simulators running at the same time

# A second machine for workers. Turn it on in ~/.kitchen/conf of the machine that runs chef.
#   REMOTE=true            use the second machine; false keeps every new worker here
#   REMOTE_HOST=<name>     its SSH name, also saved in Herdr (herdr machine add <name>)
REMOTE=false
REMOTE_HOST=
LOCAL_MAX=4                       # workers on this machine before the second one is used
REMOTE_KITCHEN="~/Agents/kitchen/bin/kitchen"
